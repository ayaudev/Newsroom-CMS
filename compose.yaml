services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - newsroom_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom -d newsroom"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  newsroom_pg:
